<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5B3A">
<title>Gaon Bazaar</title>
<style>
:root{--bg:#FAF7F2;--card:#fff;--ink:#1B2620;--mute:#5F6B64;--green:#1E5B3A;--red:#C1272D;--line:#E3DDD0;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121A15;--card:#1B261F;--ink:#EEF3EF;--mute:#9DAEA3;--green:#6FBF8E;--red:#EE6B70;--line:#2B3A30;--on:#0E1510}}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali","Noto Sans Devanagari","Segoe UI",sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}
.top{position:sticky;top:0;z-index:5;background:var(--green);color:var(--on);padding:calc(10px + env(safe-area-inset-top,0)) 14px 10px;border-bottom:4px solid var(--red)}
.top .r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:22px}
.top small{opacity:.85}
.wrap{max-width:560px;margin:0 auto;padding:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700}
.btn.g{background:var(--green);color:var(--on)}
.btn.o{background:transparent;color:var(--green);border:1.5px solid var(--green)}
.btn.s{padding:7px 12px;font-size:15px}
.lang{background:transparent;border:1.5px solid var(--on);color:var(--on);border-radius:8px;padding:5px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.chip[aria-pressed=true]{background:var(--green);color:var(--on);border-color:var(--green)}
input,select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:10px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.item.sold{opacity:.6}
.item img{width:100%;height:210px;object-fit:cover;display:block;background:var(--line)}
.nopic{height:70px;display:grid;place-items:center;background:var(--line);color:var(--mute);font-size:14px}
.in{padding:12px 14px}
.p{font-size:22px;font-weight:800;color:var(--green)}
.m{color:var(--mute);font-size:14px}
.tag{background:var(--red);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts a{text-decoration:none;display:inline-block}
.msg{text-align:center;color:var(--mute);padding:26px 8px}
.err{color:var(--red);font-weight:600;margin:0 0 10px}
#pv{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-bottom:10px}
#pic{position:absolute;opacity:0;width:1px;height:1px}
[hidden]{display:none!important}

/* Cart & checkout */
.cartbar{display:flex;justify-content:flex-end;margin-bottom:10px}
.cartbtn{position:relative}
.cartcount{position:absolute;top:-8px;right:-8px;background:#C1272D;color:#fff;border-radius:99px;min-width:22px;height:22px;padding:1px 5px;text-align:center;font-size:12px;font-weight:800}
.cartrow{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}
.cartrow:last-child{border-bottom:0}
.cartrow .grow{flex:1}
.qty{display:flex;align-items:center;gap:7px}
.qty button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 9px}
.total{font-size:20px;font-weight:800;color:var(--green);margin:12px 0}
.orderbox{margin-top:12px}
</style>
</head>
<body>
<header class="top"><div class="r"><div><h1 id="ttl"></h1><small id="sub"></small></div><div style="display:flex;gap:6px"><button class="lang" id="lang"></button></div></div></header>
<main class="wrap">
  <div class="cartbar"><button class="btn g cartbtn" id="cartBtn">🛒 Cart <span class="cartcount" id="cartCount">0</span></button></div>
  <div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" id="sell"></button><button class="btn o" id="ref"></button></div>
  <div class="box" id="form" hidden>
    <p class="err" id="err" hidden></p>
    <img id="pv" alt="" hidden>
    <input type="file" id="pic" accept="image/*"><label class="btn o" for="pic" id="picL" style="display:inline-block;margin-bottom:10px"></label>
    <input id="t" maxlength="80">
    <input id="pr" inputmode="numeric" maxlength="7">
    <select id="cat"></select>
    <input id="vil" maxlength="60">
    <input id="nm" maxlength="40">
    <input id="ph" inputmode="numeric" maxlength="10">
    <div style="display:flex;gap:8px"><button class="btn g" id="save"></button><button class="btn o" id="cancel"></button></div>
  </div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="vils"></div>
  <div class="box" id="cartBox" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">🛒 Cart</h2><button class="btn o s" id="closeCart">Close</button>
    </div>
    <div id="cartItems"></div>
    <div class="total" id="cartTotal">Total: ₹0</div>
    <button class="btn g" id="checkoutBtn" style="width:100%">Proceed to Checkout</button>
  </div>
  <div class="box" id="checkoutBox" hidden>
    <h2 style="margin-top:0">Checkout</h2>
    <input id="buyerName" placeholder="Your name">
    <input id="buyerPhone" inputmode="numeric" maxlength="10" placeholder="Mobile number (10 digits)">
    <input id="buyerAddress" maxlength="150" placeholder="Delivery address">
    <input id="buyerVillage" maxlength="60" placeholder="Village / City">
    <input id="buyerPin" inputmode="numeric" maxlength="6" placeholder="PIN code">
    <select id="paymentMethod"><option value="cod">Cash on Delivery</option><option value="contact">Contact seller first</option></select>
    <div class="total" id="checkoutTotal">Total: ₹0</div>
    <div style="display:flex;gap:8px"><button class="btn g" id="placeOrder">Place Order</button><button class="btn o" id="cancelCheckout">Back</button></div>
    <p class="err" id="orderErr" hidden></p>
  </div>
  <div id="list"></div>
</main>

var cart=[];

function saveCart(){ls("gb_cart",JSON.stringify(cart));renderCart()}
function cartQty(id){var c=cart.filter(function(i){return i.id===id})[0];return c?c.qty:0}
function addCart(id){
  var x=D.filter(function(i){return i.id===id})[0]; if(!x||x.sold)return;
  var c=cart.filter(function(i){return i.id===id})[0];
  if(c)c.qty++;else cart.push({id:x.id,qty:1});
  saveCart(); $("cartBox").hidden=false; $("checkoutBox").hidden=true;
}
function changeQty(id,delta){
  var c=cart.filter(function(i){return i.id===id})[0]; if(!c)return;
  c.qty+=delta;if(c.qty<=0)cart=cart.filter(function(i){return i.id!==id});
  saveCart();
}
function renderCart(){
  var count=cart.reduce(function(a,c){return a+c.qty},0);
  $("cartCount").textContent=count;
  var total=0,html="";
  cart.forEach(function(c){
    var x=D.filter(function(i){return i.id===c.id})[0];if(!x)return;

    html+='<div class="cartrow"><div class="grow"><strong>'+esc(x.title)+'</strong><div class="m">₹'+(Number(x.price)||0)+' × '+c.qty+'</div></div><div class="qty"><button data-minus="'+x.id+'">−</button><b>'+c.qty+'</b><button data-plus="'+x.id+'">+</button></div></div>';
  });
  $("cartItems").innerHTML=html||'<div class="msg">Your cart is empty.</div>';
  $("cartTotal").textContent="Total: ₹"+total;

  $("checkoutBtn").disabled=!cart.length;
}
function cartTotalValue(){

}

$("checkoutBtn").onclick=function(){
  if(!cart.length)return;
  $("checkoutBox").hidden=false;$("cartBox").hidden=true;
  $("buyerName").value=ls("gb_buyer_name")||"";
  $("buyerPhone").value=ls("gb_buyer_ph")||"";
  $("buyerAddress").value=ls("gb_buyer_addr")||"";
  $("buyerVillage").value=ls("gb_buyer_vil")||"";
  $("buyerPin").value=ls("gb_buyer_pin")||"";
  $("checkoutTotal").textContent="Total: ₹"+cartTotalValue();
  $("checkoutBox").scrollIntoView({behavior:"smooth"});
};
$("cancelCheckout").onclick=function(){$("checkoutBox").hidden=true;$("cartBox").hidden=false};
$("cartItems").onclick=function(e){
  var id=e.target.getAttribute("data-plus")||e.target.getAttribute("data-minus");
  if(id)changeQty(id,e.target.getAttribute("data-plus")?1:-1);
};
$("placeOrder").onclick=function(){
  var name=$("buyerName").value.trim(),ph=$("buyerPhone").value.replace(/\D/g,""),addr=$("buyerAddress").value.trim(),v=$("buyerVillage").value.trim(),pin=$("buyerPin").value.replace(/\D/g,"");
  if(!name||ph.length!==10||!addr||!v||pin.length!==6){$("orderErr").textContent="Please fill all checkout details correctly."; $("orderErr").hidden=false;return}
  $("orderErr").hidden=true;$("placeOrder").disabled=true;
  var payload={p_buyer_name:name,p_buyer_phone:ph,p_address:addr,p_village:v,p_pin:pin,p_payment:$("paymentMethod").value,p_items:cart.map(function(c){return {id:c.id,qty:c.qty}}),p_total:cartTotalValue(),p_token:token};
  rpc("create_order",payload).then(function(){
    ls("gb_buyer_name",name);ls("gb_buyer_ph",ph);ls("gb_buyer_addr",addr);ls("gb_buyer_vil",v);ls("gb_buyer_pin",pin);
    cart=[];saveCart();$("checkoutBox").hidden=true;
    alert("Order placed successfully!");
    load();
  }).catch(function(){alert("Order could not be placed. Supabase order table/RPC is not configured yet.")}).then(function(){$("placeOrder").disabled=false});
};

labels();render();renderCart();load();
</script>
</body>
</html>
